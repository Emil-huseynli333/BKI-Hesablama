<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Our Support Team | bkihesablama.site</title>
    <style>
        :root { --primary-green: #4e7d5e; --bg-light: #f4f7f6; --text-main: #2d3748; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg-light); padding: 0 20px 40px 20px; color: var(--text-main); margin: 0; display: flex; flex-direction: column; align-items: center; }
        
        .navbar { width: 100%; max-width: 850px; background: white; margin-top: 20px; margin-bottom: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; box-sizing: border-box; position: sticky; top: 10px; z-index: 1000; }
        .nav-logo { font-weight: 800; color: var(--primary-green); text-decoration: none; font-size: 18px; }
        .nav-links { display: flex; gap: 15px; }
        .nav-links a { text-decoration: none; color: var(--text-main); font-size: 13px; font-weight: 600; }

        .container { max-width: 800px; width: 100%; background: white; padding: 50px; border-radius: 25px; box-shadow: 0 12px 30px rgba(0,0,0,0.06); box-sizing: border-box; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .submit-btn { background: var(--primary-green); color: white; border: none; padding: 15px 30px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; }

        .footer-links { display: flex; gap: 20px; margin-top: 40px; border-top: 1px solid #e2e8f0; padding-top: 20px; }
        .footer-links a { text-decoration: none; color: var(--primary-green); font-size: 14px; font-weight: 600; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="https://www.bkihesablama.site" class="nav-logo">BMI Calculator</a>
        <div class="nav-links">
            <a href="https://www.bkihesablama.site/about">About</a>
            <a href="https://www.bkihesablama.site/contact">Contact</a>
            <a href="https://www.bkihesablama.site/privacy">Privacy</a>
            <a href="https://www.bkihesablama.site/terms">Terms</a>
        </div>
    </nav>

    <div class="container">
        <h1>Contact Us</h1>
        <form action="https://formspree.io/f/xjgarzre" method="POST">
            <div class="form-group"><label>Full Name</label><input type="text" name="name" required></div>
            <div class="form-group"><label>Email Address</label><input type="email" name="_replyto" required></div>
            <div class="form-group"><label>Message</label><textarea name="message" rows="4" required></textarea></div>
            <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </div>

    <div class="footer-links">
        <a href="https://www.bkihesablama.site/about">About Us</a>
        <a href="https://www.bkihesablama.site/contact">Contact Us</a>
        <a href="https://www.bkihesablama.site/privacy">Privacy Policy</a>
        <a href="https://www.bkihesablama.site/terms">Terms of Service</a>
    </div>
</body>
</html>
